{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">Tambah Info Tag</div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="name" class="form-label">Nama Info Tag</label>
                    <input type="text" name="name" id="name" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success">Simpan</button>
                <a href="{% url 'infotag_list' %}" class="btn btn-secondary">Kembali</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
