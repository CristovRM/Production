{% extends 'base.html' %}
{% block title %}Edit operator{% endblock%}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Edit Operator</h2>

    <form method="post" class="card p-3">
        {% csrf_token %}

        <div class="row g-3">
            <div class="col-md-4">
                <label for="employee_id" class="form-label">Employee ID</label>
                <input type="text" name="employee_id" id="employee_id" class="form-control"
                       value="{{ item.employee_id }}">
            </div>

            <div class="col-md-4">
                <label for="initial" class="form-label">Initial</label>
                <input type="text" name="initial" id="initial" class="form-control"
                       value="{{ item.initial }}">
            </div>

            <div class="col-md-4">
                <label for="name" class="form-label">Nama <span class="text-danger">*</span></label>
                <input type="text" name="name" id="name" class="form-control"
                       value="{{ item.name }}" required>
            </div>

            <div class="col-md-6">
                <label for="position" class="form-label">Position</label>
                <select name="position" id="position" class="form-control">
                    <option value="">-- Pilih Position --</option>
                    {% for pos in positions %}
                        <option value="{{ pos.0 }}" {% if item.position == pos.0 %}selected{% endif %}>
                            {{ pos.1 }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label for="work_station" class="form-label">Work Station</label>
                <select name="work_station" id="work_station" class="form-control">
                    <option value="">-- Pilih Work Station --</option>
                    {% for ws in work_stations %}
                        <option value="{{ ws.0 }}" {% if item.work_station == ws.0 %}selected{% endif %}>
                            {{ ws.1 }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-12">
                <label for="remarks" class="form-label">Remarks</label>
                <textarea name="remarks" id="remarks" class="form-control" rows="3">{{ item.remarks }}</textarea>
            </div>
        </div>

        <div class="mt-4 text-end">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save me-1"></i> Simpan
            </button>
            <a href="{% url 'operator_list' %}" class="btn btn-secondary">
                <i class="fas fa-times me-1"></i> Batal
            </a>
        </div>
    </form>
</div>
{% endblock %}
