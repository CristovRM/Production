{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Edit Booked Hours</h2>

    <form method="post" class="card p-3">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nama</label>
                <input type="text" name="name" class="form-control" value="{{ item.name }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Durasi (jam)</label>
                <input type="number" name="duration" step="0.01" class="form-control" value="{{ item.duration }}" required>
            </div>
        </div>

        <div class="mt-4 text-end">
            <button type="submit" class="btn btn-success">Simpan Perubahan</button>
            <a href="{% url 'bookedhours_list' %}" class="btn btn-secondary">Kembali</a>
        </div>
    </form>
</div>
{% endblock %}
