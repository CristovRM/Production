{% extends 'base_display.html' %}

{% block content %}
    {% load static %}

    <div class="container-fluid">
        <div class="row text-center mb-3">
            <h5>Production Dashboard for {{ date_date|date:"l, j F Y" }}</h5>
        </div>
        <div class= "row mb-3">
            <div class= "col-6">
                <div class="card">
                    <div class="card-body">
                        <div class="app-card app-card-chart h-100 shadow-sm">
                                <div class="app-card-body p-4">					   
                                    <div class="chart-container">
                                        <canvas id="chart-bar-threading-1" style="height:33vh; width:100%" ></canvas>
                                    </div>
                                </div><!--//app-card-body-->
                            </div><!--//app-card-->
                    </div>
                </div>
            </div>
            <div class= "col-6">
                <div class="card">
                    <div class="card-body">
                        <div class="app-card app-card-chart h-100 shadow-sm">
                                <div class="app-card-body p-4">					   
                                    <div class="chart-container">
                                        <canvas id="chart-bar-welding-1" style="height:33vh; width:100%" ></canvas>
                                    </div>
                                </div><!--//app-card-body-->
                            </div><!--//app-card-->
                    </div>
                </div>
            </div>
        </div>
        <div class= "row">
            <div class= "col-6">
                <div class="card">
                    <div class="card-body">
                        <div class="app-card app-card-chart h-100 shadow-sm">
                                <div class="app-card-body p-4">					   
                                    <div class="chart-container">
                                        <canvas id="chart-bar-threading-2" style="height:33vh; width:100%" ></canvas>
                                    </div>
                                </div><!--//app-card-body-->
                            </div><!--//app-card-->
                    </div>
                </div>
            </div>
            <div class= "col-6">
                <div class="card">
                    <div class="card-body">
                        <div class="app-card app-card-chart h-100 shadow-sm">
                                <div class="app-card-body p-4">					   
                                    <div class="chart-container">
                                        <canvas id="chart-bar-welding-2" style="height:33vh; width:100%" ></canvas>
                                    </div>
                                </div><!--//app-card-body-->
                            </div><!--//app-card-->
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{ chart_data|json_script:"chart-data" }}

    <script>

        document.addEventListener('DOMContentLoaded', function () {
            const chartData = JSON.parse(document.getElementById('chart-data').textContent);

            const chartConfigs = [
                { id: 'chart-bar-threading-1', data: chartData.threading_day },
                { id: 'chart-bar-welding-1', data: chartData.welding_day },
                { id: 'chart-bar-threading-2', data: chartData.threading_night },
                { id: 'chart-bar-welding-2', data: chartData.welding_night },
            ];

           Chart.register(ChartDataLabels); // Daftarkan plugin

            chartConfigs.forEach(cfg => {
                const ctx = document.getElementById(cfg.id);
                if (ctx) {
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: cfg.data.machines,
                            datasets: [
                                {
                                    label: 'OEE (%)',
                                    data: cfg.data.oee,
                                    backgroundColor: 'rgba(75, 192, 192, 0.7)',
                                    datalabels: {
                                        align: 'end',
                                        anchor: 'end',
                                        formatter: function(value) {
                                            const emoji = value >= 80 ? '😊' : '😞';
                                            return `${value}${emoji}`;
                                        },
                                        font: {
                                            size: 11
                                        }
                                    }
                                },
                                {
                                    label: 'Reject (EA)',
                                    data: cfg.data.reject,
                                    backgroundColor: 'rgba(255, 99, 132, 0.7)',
                                    datalabels: {
                                        align: 'end',
                                        anchor: 'end',
                                        formatter: value => `${value}`,
                                        font: { size: 11 },
                                        color: '#000'
                                    }
                                },
                                {
                                    label: 'Non Record Time (HRS)',
                                    data: cfg.data.not_run,
                                    backgroundColor: 'rgba(255, 206, 86, 0.7)',
                                    datalabels: {
                                        align: 'end',
                                        anchor: 'end',
                                        formatter: value => `${value}`,
                                        font: { size: 11 },
                                        color: '#000'
                                    }
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: cfg.data.label
                                },
                                datalabels: {
                                    display: true
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        },
                        plugins: [ChartDataLabels]
                    });
                }
            });

        });
    </script>


{% endblock %}
