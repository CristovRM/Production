{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Weld Final</h2>
    <div class="card px-3 py-3">
        <form method="post">
            {% csrf_token %}
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="bjo" class="form-label">BJO <small class="text-muted">(type to search)</small></label>
                    <div class="searchable-select" id="bjo_searchable">
                        <input type="text" 
                               id="bjo_search" 
                               class="form-control searchable-input" 
                               placeholder="Type to search BJO..." 
                               autocomplete="off">
                        <div class="searchable-dropdown" id="bjo_dropdown">
                            <div class="dropdown-item" data-value="">---Pilih Job Order---</div>
                            {% for job in job_list %}
                                <div class="dropdown-item" data-value="{{ job.id }}">
                                    {{ job }}
                                </div>
                            {% endfor %}
                        </div>
                        <input type="hidden" name="bjo" id="bjo_hidden">
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="shift" class="form-label">Shift</label>
                    <select name="shift" id="id_shift" class="form-control">
                        <option value="">---Pilih Shift---</option>
                        {% for shift in shift_list %}
                            <option value="{{ shift.id }}">{{ shift }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="operator" class="form-label">Operator <small class="text-muted">(type to search)</small></label>
                    <div class="searchable-select" id="operator_searchable">
                        <input type="text" 
                               id="operator_search" 
                               class="form-control searchable-input" 
                               placeholder="Type to search Operator..." 
                               autocomplete="off">
                        <div class="searchable-dropdown" id="operator_dropdown">
                            <div class="dropdown-item" data-value="">---Pilih Operator---</div>
                            {% for operator in operator_list %}
                                <div class="dropdown-item" data-value="{{ operator.id }}">
                                    {{ operator.name }}
                                </div>
                            {% endfor %}
                        </div>
                        <input type="hidden" name="operator" id="operator_hidden">
                    </div>
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-warning text-uppercase">Lanjut...</button>
            </div>
        </form>
    </div>
</div>

<style>
/* Searchable Select Styling */
.searchable-select {
    position: relative;
}

.searchable-input {
    cursor: pointer;
    text-align: left !important;
}

.searchable-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #ced4da;
    border-radius: 0.375rem;
    max-height: 250px;
    overflow-y: auto;
    z-index: 1050;
    display: none;
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    margin-top: 2px;
}

.dropdown-item {
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
    font-size: 0.875rem;
    border-bottom: 1px solid #f8f9fa;
    transition: background-color 0.15s ease;
}

.dropdown-item:hover {
    background-color: #e9ecef;
}

.dropdown-item.selected {
    background-color: #0d6efd;
    color: white;
    font-weight: 500;
}

.dropdown-item.hidden {
    display: none;
}

.no-results {
    padding: 12px;
    color: #6c757d;
    font-style: italic;
    text-align: center;
    font-size: 0.875rem;
}

.searchable-input.has-value {
    background-color: #e8f5e8;
    font-weight: 500;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Searchable Select Class
    class SearchableSelect {
        constructor(containerSelector, options = {}) {
            this.container = document.querySelector(containerSelector);
            if (!this.container) return;
            
            this.input = this.container.querySelector('.searchable-input');
            this.dropdown = this.container.querySelector('.searchable-dropdown');
            this.hiddenInput = this.container.querySelector('input[type="hidden"]');
            
            this.placeholder = options.placeholder || 'Type to search...';
            this.onSelect = options.onSelect || function() {};
            this.originalItems = [];
            this.selectedValue = '';
            this.selectedText = '';
            
            this.init();
        }
        
        init() {
            this.originalItems = Array.from(this.dropdown.children).map(item => ({
                element: item.cloneNode(true),
                value: item.dataset.value,
                text: item.textContent.trim().toLowerCase(),
                originalText: item.textContent.trim()
            }));
            
            this.setupEvents();
        }
        
        setupEvents() {
            this.input.addEventListener('focus', () => {
                this.showDropdown();
            });
            
            this.input.addEventListener('blur', () => {
                setTimeout(() => {
                    this.hideDropdown();
                }, 200);
            });
            
            this.input.addEventListener('input', () => {
                this.filterItems();
            });
            
            document.addEventListener('click', (e) => {
                if (!this.container.contains(e.target)) {
                    this.hideDropdown();
                }
            });
        }
        
        showDropdown() {
            this.dropdown.style.display = 'block';
            this.filterItems();
        }
        
        hideDropdown() {
            this.dropdown.style.display = 'none';
        }
        
        filterItems() {
            const searchTerm = this.input.value.toLowerCase().trim();
            this.dropdown.innerHTML = '';
            
            let visibleCount = 0;
            
            this.originalItems.forEach(item => {
                if (searchTerm === '' || item.text.includes(searchTerm)) {
                    const clonedItem = item.element.cloneNode(true);
                    
                    if (item.value === this.selectedValue) {
                        clonedItem.classList.add('selected');
                    }
                    
                    clonedItem.addEventListener('click', () => {
                        this.selectItem(item.value, item.originalText);
                    });
                    
                    this.dropdown.appendChild(clonedItem);
                    visibleCount++;
                }
            });
            
            if (visibleCount === 0 && searchTerm !== '') {
                const noResults = document.createElement('div');
                noResults.className = 'no-results';
                noResults.textContent = 'No results found';
                this.dropdown.appendChild(noResults);
            }
        }
        
        selectItem(value, text) {
            this.selectedValue = value;
            this.selectedText = text;
            this.input.value = text;
            this.hiddenInput.value = value;
            
            if (value) {
                this.input.classList.add('has-value');
            } else {
                this.input.classList.remove('has-value');
            }
            
            this.hideDropdown();
            this.onSelect(value, text);
        }
        
        reset() {
            this.input.value = '';
            this.input.classList.remove('has-value');
            this.hiddenInput.value = '';
            this.selectedValue = '';
            this.selectedText = '';
        }
    }

    // Initialize BJO Searchable Select
    new SearchableSelect('#bjo_searchable', {
        placeholder: 'Type to search BJO...'
    });

    // Initialize Operator Searchable Select
    new SearchableSelect('#operator_searchable', {
        placeholder: 'Type to search Operator...'
    });

    // Form validation
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
        const bjoValue = document.getElementById('bjo_hidden').value;
        const shiftValue = document.getElementById('id_shift').value;
        const operatorValue = document.getElementById('operator_hidden').value;

        if (!bjoValue) {
            e.preventDefault();
            alert('BJO harus dipilih!');
            return false;
        }

        if (!shiftValue) {
            e.preventDefault();
            alert('Shift harus dipilih!');
            return false;
        }

        if (!operatorValue) {
            e.preventDefault();
            alert('Operator harus dipilih!');
            return false;
        }

        return true;
    });
});
</script>

{% endblock %}
